apiVersion: apps/v1
kind: Deployment

metadata:
  name: pythonapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: pythonapp

  template:
    metadata:
      labels:
        app: pythonapp

    spec:
      containers:
      - name: pythonapp
        image: kalicharandas001/awspythonapp:v1

        ports:
        - containerPort: 5000